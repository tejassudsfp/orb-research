  name: '@orb/host/keychain'
- id: orb-web-shell
  name: '@orb/host/web-shell'
  inject:
    - webServer
  config:
    distIndex: !!js >-
      process.getBuiltinModule('node:path').join(process.env.ORB_UI_DIST,
      'index.html')
- id: orb-canvas
  name: '@orb/canvas/service'
- id: orb-web-search
  name: '@orb/canvas/web'
  inject:
    - web
    - credentials
- id: orb-parallel
  name: '@orb/canvas/parallel'
  inject:
    - credentials
    - orbCanvas
- id: orb-models
  name: '@orb/host/models'
  inject:
    - llm
    - credentials
    - orbCanvas
    - agentDefaultModel
- id: orb-cost
  name: '@orb/host/cost'
  inject:
    - sessionQuery
    - orbCanvas
- id: orb-agents
  name: '@orb/agents/service'
  inject:
    - agents
    - agentPresets
    - agentDefaultModel
    - orbCanvas
    - subagents
    - orbModels
- id: orb-host
  name: '@orb/host/remote'
  inject:
    - typert
    - orbCanvas
    - orbAgents
    - credentials
    - orbModels
    - orbCost
- id: orb-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: orb
    name: Orb
    description: >-
      Orb research agent. Board tools only; no shell, filesystem, workflow or
      job tools.
    order: 0
    plugins:
      - id: orb-board-tools
        name: '@orb/canvas/tools'
        inject:
          - tools
          - orbCanvas
      - id: orb-source-tools
        name: '@orb/canvas/sources'
        inject:
          - tools
          - orbCanvas
          - web
      - id: orb-parallel-tools
        name: '@orb/canvas/parallel-tools'
        inject:
          - tools
          - orbCanvas
          - orbParallel
      - id: orb-port-tools
        name: '@orb/canvas/port'
        inject:
          - tools
          - orbCanvas
      - id: orb-tool-guard
        name: '@orb/agents/guard'
        inject:
          - tools
          - orbCanvas
        config:
          agent: orb
      - id: orb-agent-tools
        name: '@orb/agents/tools'
        inject:
          - tools
          - orbAgents
      - id: persona
        name: '@orb/agents/persona'
        inject:
          - systemPrompt
