# orb packaging (P5.4; P6.1b brand: lowercase "orb" everywhere the user sees the name, Constellation icon and dmg art
# from `pnpm brand`). Run from the repo root with `pnpm dist`: it builds, stages release/stage (scripts/dist-stage.ts)
# and runs electron-builder with this file. Output: release/dist/orb-<version>-arm64.dmg (gitignored).
#
# Release builds (v0.1.0+) are signed with the Developer ID Application certificate in the login Keychain and
# notarised by electron-builder through a stored notarytool profile: set APPLE_KEYCHAIN_PROFILE (see
# docs/RELEASING.md). The DMG itself is then notarised and stapled by scripts/notarize-dmg.ts. For a local unsigned
# build, run `pnpm dist:adhoc`, which overrides identity to "-" and notarize to false.
appId: ai.orb.app
# CFBundleName / CFBundleDisplayName, the .app and executable name, the menus and About: always lowercase.
productName: orb
copyright: Copyright © 2026 Tejas Parthasarathi Sudarshan (https://tejassuds.com)
electronVersion: 44.7.0
# The pinned Electron from node_modules: nothing is downloaded, and dsh's native loader accepts exactly this runtime.
electronDist: node_modules/electron/dist
directories:
  app: release/stage/app
  output: release/dist
  buildResources: apps/desktop/build
# The staged app has no dependencies (main bundles what it imports); nothing to install or rebuild.
# npmRebuild must stay on for beforeBuild to run (it returns false: nothing is installed or rebuilt).
npmRebuild: true
beforeBuild: apps/desktop/build/beforeBuild.cjs
nodeGypRebuild: false
buildDependenciesFromSource: false
asar: true
files:
  - package.json
  - out/**
# Outside the asar, as plain files: the sidecar runs from them (dsh walks real node_modules directories to find its
# bundles; the native addons are dlopen'd), the profile template is copied into DSH_HOME, the UI is served from disk.
extraResources:
  - from: release/stage/licenses
    to: licenses
    filter: ['**/*']
  - from: release/stage/node_modules
    to: node_modules
    filter: ['**/*']
  - from: release/stage/profiles/orb
    to: profiles/orb
    filter: ['**/*']
  - from: release/stage/ui
    to: ui
    filter: ['**/*']
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  minimumSystemVersion: '14.0'
  identity: 'Fanpit Technologies Private Limited (Q78J7L8TLR)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: apps/desktop/build/entitlements.mac.plist
  entitlementsInherit: apps/desktop/build/entitlements.mac.plist
  # Flat Constellation app icon (all sizes), generated by scripts/brand/build.ts.
  icon: apps/desktop/build/icon.icns
  notarize: true
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
dmg:
  artifactName: orb-${version}-${arch}.${ext}
  title: orb ${version}
  # Volume icon and window art (scripts/brand/build.ts: Paper background, so Finder's dark icon labels stay legible).
  icon: apps/desktop/build/icon.icns
  background: apps/desktop/build/background.tiff
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 210
      type: file
    - x: 410
      y: 210
      type: link
      path: /Applications
  writeUpdateInfo: false
publish: null
