<style>
body{margin:0}
a{color:#2563EB}a:hover{color:#3D5DCF}
.night{background-color:#03050C;background-image:radial-gradient(1px 1px at 22px 34px,rgba(249,252,254,.55) 50%,transparent 51%),radial-gradient(1px 1px at 140px 90px,rgba(249,252,254,.3) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 200px 180px,rgba(96,165,250,.7) 50%,transparent 51%),radial-gradient(1px 1px at 80px 210px,rgba(249,252,254,.25) 50%,transparent 51%);background-size:300px 260px}
.day{background-color:#F9FCFE;background-image:radial-gradient(rgba(17,23,29,.09) 1px,transparent 1px);background-size:24px 24px}
input::placeholder{color:rgba(128,134,142,.9)}
</style>
</helmet>
<div class="{{ t.cls }}" style="position: relative; width: 100%; height: 900px; overflow: hidden; font-family: Geist, system-ui, sans-serif; color: {{ t.text }}">
  <div aria-hidden="true" style="position: absolute; left: 8%; top: -10%; width: 620px; height: 620px; border-radius: 50%; background: {{ t.glow1 }}"></div>
  <div aria-hidden="true" style="position: absolute; right: 4%; top: 30%; width: 560px; height: 560px; border-radius: 50%; background: {{ t.glow2 }}"></div>
  <div aria-hidden="true" style="position: absolute; left: 30%; bottom: -25%; width: 700px; height: 500px; border-radius: 50%; background: {{ t.glow3 }}"></div>

  <div style="position: absolute; top: 20px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" sc-camel-view-box="0 0 28 28" aria-hidden="true" fill="none" stroke="{{ t.accent }}" stroke-width="1.6"><circle cx="14" cy="14" r="4" fill="#2563EB" stroke="none"></circle><ellipse cx="14" cy="14" rx="12" ry="5" transform="rotate(-25 14 14)"></ellipse></svg>
      <span style="font: 700 22px Geist, sans-serif; letter-spacing: -0.6px">Orb</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{ t.border }}; background: {{ t.surface }}; color: {{ t.soft }}; font: 500 14px Geist, sans-serif; cursor: pointer">Public boards</button>
      <button type="button" aria-label="{{ toggleLabel }}" sc-camel-on-click="{{ toggleMode }}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{ t.border }}; background: {{ t.surface }}; color: {{ t.soft }}; display: flex; align-items: center; gap: 8px; font: 500 14px Geist, sans-serif; cursor: pointer">
        <sc-if value="{{ isNight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <sc-if value="{{ isDay }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg></sc-if>
        <span>{{ toggleText }}</span>
      </button>
    </div>
  </div>

  <div style="position: absolute; left: 50%; top: 130px; transform: translateX(-50%); width: min(1040px, 94%); display: flex; flex-direction: column; align-items: center; gap: 22px">
    <span style="padding: 6px 14px; border-radius: 16px; border: 1px solid {{ t.borderStrong }}; background: {{ t.surface }}; font: 500 14px 'Geist Mono', monospace; letter-spacing: 0.4px; color: {{ t.taglineColor }}; text-align: center">{{ tagline }}</span>
    <h1 style="margin: 0; font: 700 46px Geist, sans-serif; line-height: 1.1; text-align: center; letter-spacing: -1.6px; white-space: nowrap">{{ w1 }}? <span style="color: {{ t.accent }}">{{ w2 }}?</span> {{ w3 }}?</h1>
  </div>
  <div style="position: absolute; left: 50%; top: 416px; transform: translateX(-50%); width: min(1040px, 94%); display: flex; flex-direction: column; align-items: center; gap: 22px">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;defaultMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;night&quot;,&quot;day&quot;],&quot;default&quot;:&quot;night&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.words = ['Kites', 'Nebula', 'Ocean', 'Saffron', 'Monsoons', 'Black holes', 'Tea', 'Chess', 'Coral', 'Volcanoes', 'Bridges', 'Bees', 'Jazz', 'Glaciers', 'Silk', 'Comets', 'Fungi', 'Lighthouses', 'Origami', 'Cricket', 'Tides', 'Spices', 'Satellites', 'Deserts'];
    this.state = { mode: null, picks: this.pick() };
  }
  pick() {
    const pool = this.words.slice();
    const out = [];
    for (let i = 0; i < 3; i++) {
      out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return out;
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ picks: this.pick() }), 2800);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const mode = this.state.mode || this.props.defaultMode || 'night';
    const night = {
      cls: 'night', taglineColor: '#F9FCFE', text: '#F9FCFE', soft: 'rgba(249,252,254,0.82)', muted: 'rgba(249,252,254,0.62)',
      accent: '#60A5FA', accentFill: '#2563EB', onAccent: '#F9FCFE',
      border: 'rgba(249,252,254,0.12)', borderStrong: 'rgba(96,165,250,0.4)',
      surface: 'rgba(17,23,29,0.7)', surfaceStrong: 'rgba(17,23,29,0.92)', inset: '#03050C',
      boxShadow: '0 0 0 6px rgba(37,99,235,0.12), 0 0 60px rgba(37,99,235,0.25), 0 30px 80px rgba(0,0,0,0.5)',
      glow1: 'radial-gradient(circle, rgba(37,99,235,0.42), rgba(37,99,235,0) 68%)',
      glow2: 'radial-gradient(circle, rgba(96,165,250,0.20), rgba(96,165,250,0) 70%)',
      glow3: 'radial-gradient(circle, rgba(61,93,207,0.30), rgba(61,93,207,0) 70%)'
    };
    const day = {
      cls: 'day', taglineColor: '#2563EB', text: '#11171D', soft: 'rgba(17,23,29,0.82)', muted: 'rgba(17,23,29,0.62)',
      accent: '#2563EB', accentFill: '#2563EB', onAccent: '#F9FCFE',
      border: 'rgba(17,23,29,0.10)', borderStrong: 'rgba(37,99,235,0.35)',
      surface: 'rgba(249,252,254,0.75)', surfaceStrong: '#F9FCFE', inset: 'rgba(17,23,29,0.05)',
      boxShadow: '0 0 0 6px rgba(37,99,235,0.08), 0 30px 70px rgba(17,23,29,0.12)',
      glow1: 'radial-gradient(circle, rgba(96,165,250,0.35), rgba(96,165,250,0) 70%)',
      glow2: 'radial-gradient(circle, rgba(37,99,235,0.16), rgba(37,99,235,0) 70%)',
      glow3: 'radial-gradient(circle, rgba(61,93,207,0.14), rgba(61,93,207,0) 70%)'
    };
    const isNight = mode === 'night';
    return {
      t: isNight ? night : day,
      isNight: isNight,
      isDay: !isNight,
      w1: this.state.picks[0],
      w2: this.state.picks[1],
      w3: this.state.picks[2],
      tagline: isNight ? 'Don\u2019t go gentle into the night!' : 'Everything the sun touches',
      toggleText: isNight ? 'Day' : 'Night',
      toggleLabel: isNight ? 'Switch to day mode' : 'Switch to night mode',
      toggleMode: () => this.setState({ mode: isNight ? 'day' : 'night' })
    };
  }
}
</script>
