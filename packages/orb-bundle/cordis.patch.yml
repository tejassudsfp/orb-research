# ---- Presets: only Orb's. The web-app presets carry bash/fs/workflow tools. ----
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: orb

# ---- Orb rows ----
- insert:
    # Plugin names are match guards, not replacements. Restore the backend under its own row.
    - id: orb-compaction
      name: '@orb/agents/compaction'
    # P4.1 `credentials` service: OrbKeychainCredentialProvider (packages/orb-host/src/keychain.ts). Layers: the
    # inherited process env (read-only, wins), then the Keychain service `ai.orb.app` (an `ai.orb.app.test.*` service
    # from ORB_KEYCHAIN_SERVICE in tests). No `.env` layering. At mount it migrates a plaintext
    # $DSH_HOME/.credentials.yaml into the Keychain and deletes it.
    - id: orb-keychain
      name: '@orb/host/keychain'
    - id: orb-web-shell
      name: '@orb/host/web-shell'
      inject:
        - webServer
      config:
        distIndex: !!js process.getBuiltinModule('node:path').join(process.env.ORB_UI_DIST, 'index.html')
    # Canvas service `orbCanvas`: canvas folders under ORB_HOME/canvases and the board.jsonl writer + fold.
    # The only writer of board.jsonl. See packages/orb-canvas/src/service.ts.
    - id: orb-canvas
      name: '@orb/canvas/service'
    # P3.5 search providers for web_search, registered with the harness web seam (ctx.web): Brave Search
    # (BRAVE_API_KEY), Tavily (TAVILY_API_KEY), OpenAI web search (OPENAI_API_KEY, the Responses API on the model
    # host). Keys resolve through the credentials service at each search; the first configured provider is the
    # only usable one. Provides `orbSearch`. See packages/orb-canvas/src/web.ts.
    - id: orb-web-search
      name: '@orb/canvas/web'
      inject:
        - web
        - credentials
    # P6.7 service `orbParallel` (packages/orb-canvas/src/parallel.ts): Parallel AI for the canvas. The REST client
    # (api.parallel.ai, key PARALLEL_API_KEY from the credentials service), the cost guard (the user approves a run
    # over $0.50 on its card), the long-run followers and the run registry (assets/parallel/runs.json).
    - id: orb-parallel
      name: '@orb/canvas/parallel'
      inject:
        - credentials
        - orbCanvas
    # Orb's Remote namespace `orb` (POST /api/orb/<method>, streams on /api/remote.mux). Served by the gateway's
    # SRC fallback for out-of-tree remotes; see packages/orb-host/src/remote.ts.
    # Service `orbAgents`: each canvas's root Orb agent (ctx.agents.create + the `orb` preset + the allow-list
    # guard). See packages/orb-agents/src/service.ts.
    # P4.2 service `orbModels` (packages/orb-host/src/models.ts): provider routes in llm-pi-ai's `providers` (edited
    # live through the harness settings service), custom providers restated from orb.json, the Test request
    # (ctx.llm.stream, maxTokens 1), model discovery, and each agent's default route by tier.
    - id: orb-models
      name: '@orb/host/models'
      inject:
        - llm
        - credentials
        - orbCanvas
        - agentDefaultModel
    # P4.3 service `orbCost` (packages/orb-host/src/cost.ts): the canvas token and cost meter. Tokens are the harness
    # `tokenUsage` projection of the canvas's root and child sessions (read through sessionQuery, live or cold), split
    # per model route; prices come from orb.json `prices`, seeded from pi-ai's catalog ModelCost.
    - id: orb-cost
      name: '@orb/host/cost'
      inject:
        - sessionQuery
        - orbCanvas
    - id: orb-agents
      name: '@orb/agents/service'
      inject:
        - agents
        - agentPresets
        - agentDefaultModel
        - orbCanvas
        - subagents
        - orbModels
        - tokenMeter
        - compaction
        - llm
    - id: orb-host
      name: '@orb/host/remote'
      inject:
        - typert
        - orbCanvas
        - orbAgents
        - credentials
        - orbModels
        - orbCost
    - id: orb-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orb
        name: Orb
        description: Orb research agent. Board tools only; no shell, filesystem, workflow or job tools.
        order: 0
        # Rows here mount once in the preset's own scope; agents bound with agentPresets.mount inherit them, so
        # these tools are agent-scoped (the global tool surface stays empty).
        plugins:
          # place_card / update_card / query_board / consolidate_cards / add_frame / update_frame / add_link over the
          # orb-cards registry and the layout engine. The caller's role comes from its
          # session id (canvas.json rootSessionId / childAgentIds), not from this row's config.
          - id: orb-board-tools
            name: '@orb/canvas/tools'
            inject:
              - tools
              - orbCanvas
          # P3.5 web_search / fetch_url / capture_page (Scout) and read_source (Orb, Scout, Critic): search through
          # ctx.web, safe fetch + extraction + the assets/sources cache (@orb/sources), page capture through
          # Electron main's loopback control channel. See packages/orb-canvas/src/sources.ts.
          - id: orb-source-tools
            name: '@orb/canvas/sources'
            inject:
              - tools
              - orbCanvas
              - web
          # P6.7 Parallel tools (parallel_extract, image_search, web_answer, deep_research, research_status, batch_enrich,
          # find_entities, entity_search, watches…) over the `orbParallel` service. See packages/orb-canvas/src/parallelTools.ts.
          - id: orb-parallel-tools
            name: '@orb/canvas/parallel-tools'
            inject:
              - tools
              - orbCanvas
              - orbParallel
          # P4.5 compose_section (Orb only): writes one section of the research document, with structural citations
          # (every paragraph cites cards in the compose scope); stored in port/ by the canvas service. See
          # packages/orb-canvas/src/port.ts and @orb/port.
          - id: orb-port-tools
            name: '@orb/canvas/port'
            inject:
              - tools
              - orbCanvas
          # The BUILD_PLAN §2.4 allow-list guard, in the preset scope: it binds every agent on this preset, including
          # sessions the gateway composes (session/create, resume), not only the root agents orbAgents creates.
          # P3.3: it applies the CALLER's allow-list (role from canvas.json by session id via orbCanvas); `agent` is
          # the list for a session that is not a known canvas agent.
          - id: orb-tool-guard
            name: '@orb/agents/guard'
            inject:
              - tools
              - orbCanvas
            config:
              agent: orb
          # P3.4 team tools: delegate / message_agent / stop_agent (Orb) and report_progress / send_message (Scout,
          # Critic, Builder). Children are continuable subagents of the root agent and join this preset; each role is
          # offered only its §2.4 tools (Orb: restrict deny; children: toolFilter.allow). See
          # packages/orb-agents/src/tools.ts.
          - id: orb-agent-tools
            name: '@orb/agents/tools'
            inject:
              - tools
              - orbAgents
          # Orb's persona (P3.3: role, 3–5 frame proposals, cite cards, typed cards over prose, delegate research).
          # The text lives in packages/orb-agents/src/persona.ts; the row hands it to dsh-persona's own apply.
          - id: persona
            name: '@orb/agents/persona'
            inject:
              - systemPrompt
