# Orb bundle patch (layer 3, after dsh-base and dsh-web-app).
# REMEMBER: a patch's `config` REPLACES the row's config whole. Restate every key you keep.
# Every disable below is recorded with its reason in docs/SPIKE_NOTES.md.

# ---- Telemetry and phone-home: all off (PRD "Privacy and telemetry") ----
- id: session-telemetry-otel
  disabled: true
  config:
    mode: DISABLED
    shutdownTimeoutMillis: 3000
    maxRequestBytes: 4000000
    exporter:
      url: 'http://127.0.0.1:9/disabled'
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500
- id: command-feedback
  disabled: true
- id: message-feedback
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
# deepseek-official sends x-deepseek-harness-user-id on every request; DeepSeek goes through llm-pi-ai instead.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: account-controller
  disabled: true
- id: web-search-deepseek
  disabled: true
# P3.5: the web seam picks the single usable search provider (Orb's providers make exactly one usable at a time);
# dsh-base pins `deepseek-official`, whose row is disabled above, so the pin is dropped. Fetch stays on `http`
# (Orb's fetch_url uses its own transport in @orb/sources; nothing calls ctx.web.fetch).
- id: web
  config:
    fetchProvider: http
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
# An extra model call per new session; Orb names canvases itself.
- id: session-title-llm
  disabled: true

# ---- Credentials: the macOS Keychain, not plaintext (P4.1) ----
# dsh-base's `credentials` row (@deepseek-ai/dsh-credentials-local) keeps keys in plaintext
# $DSH_HOME/.credentials.yaml. A patch cannot change a row's `name` (cordis-plugin-include applyEntryPatches skips a
# name mismatch), so the row is disabled here and the `orb-keychain` row below provides the one `credentials`
# service instead.
- id: credentials
  disabled: true

# ---- Orb writes its own config; no live reload or config editing ----
# Summaries must follow the current per-agent selection even before its first request on a reopened session.
- id: compaction-basic
  disabled: true

- id: hmr
  disabled: true

# ---- Permissions: workspace-write, approval never (agents have no tools that need approval) ----
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: orb
    presets:
      orb:
        sandbox: workspace-write
        approval: never

# ---- Host rows Orb does not use (shell, jobs, code runners, native pickers, office) ----
- id: terminal-controller
  disabled: true
- id: job-controller
  disabled: true
- id: cordis-host-runner
  disabled: true
- id: cordis-inspect-providers
  disabled: true
- id: open-in-app
  disabled: true
- id: office-to-pdf
  disabled: true

# ---- P5.1 boot profile: dsh-base / web-app rows Orb never uses (fewer modules to load, less to mount) ----
# Each one was checked for consumers in node_modules/@deepseek-ai/*: nothing enabled REQUIRES its service (an
# optional `ctx.get`/`ctx.inject` at most), and dsh reports no pending entry with them off. Measured in
# docs/HARNESS_NOTES.md §P5.1. Kept on although unused: `commands` (file-upload requires it, and session-controller
# requires file-upload), `bash-sandbox` (provides `shell`, which `permission` requires; no bash TOOL is mounted).
# Session titles: Orb names canvases itself and never calls session/rename (session-title-llm is off above).
- id: session-title
  disabled: true
# Background jobs and the /goal loop: no job or goal tools (tool-jobs, job-controller, command-goal, tool-goal off).
- id: jobs
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
# MCP: Orb mounts no MCP client, so MCP resource tools have nothing to serve.
- id: mcp-resources
  disabled: true
# Programmatic tool calling runtime for workflows (workflow-ptc, tool-workflow off).
- id: ptc-runtime
  disabled: true
# Skills: no skill tool or skill folders (tool-skill, skill-filesystem off).
- id: skill
  disabled: true
# Workspace browsing, the native folder picker and git change tracking (they back the dsh UI's file tree and
# deliverables; they are also file-reading surface the Orb UI must not have).
- id: workspace-files
  disabled: true
- id: workspace-controller
  disabled: true
- id: directory-picker
  disabled: true
- id: workspace-changes
  disabled: true
# Plugin inventory and session-log export (dsh UI settings pages).
- id: plugin-inventory
  disabled: true
- id: session-log-download
  disabled: true
# `@file` and `@session` references in prompts (Orb injects its own context; agents must not pull files by mention).
- id: file-reference-local
  disabled: true
- id: session-reference
  disabled: true
# dsh UI projections (turn outline, session stats). Orb's cost meter reads the `tokenUsage` projection instead.
- id: session-turn-outline
  disabled: true
- id: session-stats
  disabled: true
# Shell environment capture for bash/pwsh tools, which Orb never mounts.
- id: shell-env
  disabled: true
# The `fork` subagent provider; Orb's children use `spawn` (packages/orb-agents/src/service.ts SUBAGENT_PROVIDER).
- id: subagent-fork-in-process
  disabled: true

